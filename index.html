<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      ── Boot recovery ────────────────────────────────────────────────────────

      Deliberately inline, deliberately first, and deliberately the only script
      in this file that is either. Everything else that could catch a failure —
      RootErrorBoundary, GlobalCrashGuard — lives inside the bundle, so none of
      it exists in the one failure this handles: the bundle never arriving.

      How that happens, in the case it actually happened in. The service worker
      precaches index.html and answers every navigation from it
      (`navigateFallback` in vite.config.js), and registerType:'prompt' means a
      newly installed worker WAITS rather than taking over — on purpose, so a
      deploy never reloads a tab out from under a student mid-question. The cost
      is that a browser can keep serving one build's HTML for as long as a tab
      stays open. That HTML names that build's hashed chunks, and chunks have a
      shelf life: `app-assets` evicts at 200 entries, and Safari clears site data
      after seven days without a visit. Once the chunk is gone from the cache AND
      a later deploy has replaced it on the server, the page loads, asks for a
      script that 404s, and stops — leaving #seo-shell on screen with nothing to
      replace it. It reads as "the site turned into a plain text page", it
      survives an ordinary reload, and the only way out is clearing website data,
      which nobody should have to know.

      So: if the shell is still on screen after the bundle has had its chance,
      throw away the caches and workers that produced it and load once more from
      the network. Guarded in sessionStorage, so a genuinely broken deploy
      degrades to the static page with an honest message rather than a reload
      loop — one recovery per tab, ever.

      WHY IT IS UP HERE, above the font stylesheet, rather than at the end of
      <body> where it started. A parser-inserted script does not run while a
      stylesheet is still pending, and the fonts below come from a third party.
      Measured in a browser: with fonts.googleapis.com unreachable, the identical
      script at the end of <body> did not execute for twelve seconds — so on
      exactly the degraded network where a boot is most likely to fail, the
      thing that fixes it was last in the queue. In <head>, ahead of every
      <link>, it runs the moment the parser reaches it. Being that early means it
      cannot look at #seo-shell yet, which is why every check below waits for
      DOMContentLoaded rather than reading the DOM straight away.
    -->
    <script>
      (function () {
        var GUARD = 'msp:boot-recovery';
        var DEADLINE_MS = 15000; // generous: a cold 3G load of the entry chunk
        var done = false;
        var failedAsset = null;

        // What this script did, for scripts/verifyBootRecovery.mjs to read. Cheap
        // enough to always be on, and the alternative is a check that has to infer
        // the watchdog's behavior from side effects and cannot tell "never fired"
        // apart from "fired and did nothing".
        var trace = window.__mspBoot = { started: Date.now(), recovered: 0, booted: 0, announced: 0, reason: null };

        // Nothing below may read the DOM before it exists: this script runs while
        // <body> is still an empty promise, so an early getElementById would say
        // "no shell" and mean "not parsed yet".
        function ready(fn) {
          if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
          else fn();
        }

        function booted() {
          return document.readyState !== 'loading' && !document.getElementById('seo-shell');
        }

        function announce() {
          var shell = document.getElementById('seo-shell');
          if (!shell || document.getElementById('msp-boot-msg')) return;
          var box = document.createElement('p');
          box.id = 'msp-boot-msg';
          box.setAttribute('role', 'status');
          box.style.cssText = 'margin:1.5rem 0;padding:0.9rem 1rem;border:1px solid #30363d;'
            + 'border-radius:8px;background:#0b0f16;color:#e7ecf2;font-weight:600;';
          box.innerHTML = 'The app did not finish loading, so this is the plain-text version of '
            + 'the page. Everything here works as a link. '
            + '<a href="" style="color:#72b5f8">Try again</a>';
          box.querySelector('a').addEventListener('click', function (e) {
            e.preventDefault();
            location.reload();
          });
          shell.insertBefore(box, shell.firstChild);
          trace.announced = Date.now();
        }

        // Clearing the caches is the whole point: the stale HTML and the record of
        // the chunk that is gone both live in them. Nothing here touches
        // localStorage, IndexedDB or a session cookie, so a signed-in student
        // stays signed in and unsynced work is untouched.
        function recover(reason) {
          if (done || booted()) return;
          done = true;
          trace.reason = reason;
          trace.recovered = Date.now();

          var already;
          try { already = sessionStorage.getItem(GUARD); } catch (e) { already = '1'; }
          if (already) { announce(); return; }
          try { sessionStorage.setItem(GUARD, String(Date.now())); } catch (e) { /* private mode */ }

          var jobs = [];
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            }).catch(function () {}));
          }
          if (window.caches && caches.keys) {
            jobs.push(caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }).catch(function () {}));
          }
          // Reload however the cleanup went — a hung promise must not be the thing
          // that leaves someone on a dead page.
          var go = function () { location.reload(); };
          Promise.all(jobs).then(go, go);
          setTimeout(go, 4000);
        }

        /** Only ever decides once the DOM is there to decide about. */
        function consider(reason) {
          ready(function () { if (!booted()) recover(reason); });
        }

        // A failed script or stylesheet is proof, not a guess — act on it rather
        // than waiting out the deadline. Registered before anything can load, so
        // nothing is missed.
        window.addEventListener('error', function (e) {
          var el = e && e.target;
          if (!el || el === window) return;
          var url = el.src || el.href;
          if (!url) return;
          if (url.indexOf('/assets/') === -1 && url.indexOf('/src/main.jsx') === -1) return;
          failedAsset = url;
          consider('asset-error');
        }, true);

        // The backstop, for everything that fails without an error event: a chunk
        // that resolves to an HTML error page, a module that throws on execute.
        var timer = setTimeout(function () { consider('deadline'); }, DEADLINE_MS);

        // A successful boot clears the guard, so a tab that recovers today can
        // still recover after the next deploy.
        ready(function () {
          var poll = setInterval(function () {
            if (!booted()) return;
            clearInterval(poll);
            clearTimeout(timer);
            done = true;
            trace.booted = Date.now();
            try { sessionStorage.removeItem(GUARD); } catch (e) { /* private mode */ }
          }, 250);
        });
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <!--
      Kept under 155 characters on purpose: past that, search engines truncate
      the snippet mid-sentence. The old one was 249. This tag and the six others
      below are the *fallback* values — scripts/prerenderSeo.mjs overwrites each
      of them per URL at build time, and scripts/verifySeo.mjs fails the build if
      any page's replacement is missing or over length. Keep this file's copy in
      step with the '/' entry in src/lib/seoRoutes.js.
    -->
    <meta name="description" content="Free health-career prep for high schoolers: a 10-pathway diagnostic, verified lessons, flashcards, and a full college application portfolio." />
    <meta name="robots" content="index, follow" />
    <!-- Matches BALANCED.bg (the default palette) so the mobile browser chrome
         and the iOS status bar don't frame the app in a different color. -->
    <meta name="theme-color" content="#272d34" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      No SVG favicon here on purpose. public/icon.svg is 1.58 MB — it is the mark
      exported with its full glow artwork rather than as flat vector shapes — and
      a browser that prefers `image/svg+xml` fetches the whole thing to paint a
      16-pixel tab icon. That was, by a wide margin, the single largest file the
      average first visit downloaded: more than the entire CSS bundle and every
      font put together, for a favicon.

      The PNGs below are already generated from the same master (public/logo.png,
      via scripts/renderIcons.mjs) and total under 8 kB for the pair. The file
      itself stays in public/ — it is a legitimate export anyone may deep-link —
      it just is not something every visitor is made to download.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />

    <!--
      The one image the loading screen draws (src/components/BrandJourney.jsx's
      StillMark). Without the hint a cold first visit opens on an empty ring.

      This used to preload /brand/book-left.png and /brand/book-right.png — the
      first two frames of the six-beat animation. That animation is switched off
      at JOURNEY_ANIMATION_ENABLED, so those two are no longer on screen at boot
      and preloading them was fetching 56 kB nothing was going to draw. If the
      animation is switched back on, swap these back too: it needs those two
      immediately and mark.png not at all.
    -->
    <link rel="preload" as="image" href="/brand/mark.png" />
    <title>MedSchoolPrep — Your Path Into Medicine</title>

    <!--
      The canonical is absolute, and pinned to the production origin, because the
      same build also serves a preview domain — without this both would be
      indexable as duplicates of the one URL in /sitemap.xml.

      This value is the landing page's, and it is also the *fallback*: it used to
      be the canonical every URL on the site shipped, which told crawlers that
      /login, /parents and /legal/privacy were all copies of "/". Each public URL
      is now served its own prerendered HTML with its own canonical
      (scripts/prerenderSeo.mjs), and src/lib/seo.js rewrites this tag on every
      client-side navigation after that.
    -->
    <link rel="canonical" href="https://medschoolprep.cloud/" />

    <!-- Fonts: Bricolage Grotesque (display) + Onest (body) + JetBrains Mono (data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Onest:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- CDN preconnects -->
    <link rel="preconnect" href="https://img.youtube.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!--
      Ahrefs Web Analytics.

      Cookieless and privacy-first by design: it stores nothing on the device,
      builds no cross-site profile, and collects no personal information — which
      is why it is the analytics that can sit on a site whose users are minors
      without contradicting src/legal/privacy.js. It is loaded `async` and
      `defer`-equivalent, so it never blocks first paint.

      The data-key identifies the Ahrefs project (Site Audit / Web Analytics for
      medschoolprep.cloud). If Web Analytics ever reports "not installed" after a
      deploy, check this string character-for-character against the value in
      Ahrefs → Project settings → Web Analytics before looking anywhere else.
    -->
    <script src="https://analytics.ahrefs.com/analytics.js" data-key="TUdzrzI5M3543r3VCv9fDQ" async></script>

    <!--
      Google AdSense, tagged for child-directed treatment.

      This site's audience is high-school students, i.e. minors, and a large
      share are under 16. That makes untagged, personalized advertising a legal
      problem on three fronts at once:

        • COPPA forbids behavioral advertising to under-13s without verifiable
          parental consent, and Google may independently classify a site like
          this as child-directed under its own obligations.
        • Connecticut's amended data privacy act (in force 1 July 2026) bans
          targeted advertising to anyone under 18 outright — a categorical ban
          that user consent cannot cure. Colorado, and a growing list of other
          states, restrict the same conduct.
        • The CCPA/CPRA requires opt-in consent to sell or share the personal
          information of consumers under 16.

      `tagForChildDirectedTreatment` (TFCD) is set BEFORE the AdSense script
      loads — order matters here, because the tag has to be on the page when the
      first ad request is built, and an ad served before the flag is set is not
      retroactively un-personalized. It disables interest-based advertising and
      remarketing for every visitor regardless of age, which is exactly what
      src/legal/privacy.js § 8 tells users we do.

      Do not remove this block or reorder it below the script tag without
      changing the Privacy Policy to match — scripts/verifyLegal.mjs fails the
      build if the two disagree, because a policy that overstates a protection
      is worse than no policy at all.
    -->
    <script>
      window.adsbygoogle = window.adsbygoogle || [];
      window.adsbygoogle.requestNonPersonalizedAds = 1;
      (window.adsbygoogle = window.adsbygoogle || []).push({
        google_adtest: 'off',
        tagForChildDirectedTreatment: 1,
        tagForUnderAgeOfConsent: 1,
        restrictDataProcessing: 1,
      });
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4110886931308197"
     crossorigin="anonymous"></script>

    <!-- Open Graph -->
    <meta property="og:title" content="MedSchoolPrep — Your Path Into Medicine" />
    <meta property="og:description" content="A personalized path into medicine for high schoolers — pathway diagnostic, verified lessons, and a full application portfolio in one place." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://medschoolprep.cloud/" />
    <meta property="og:site_name" content="MedSchoolPrep" />
    <meta property="og:image" content="https://medschoolprep.cloud/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="The MedSchoolPrep logo" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MedSchoolPrep — Your Path Into Medicine" />
    <meta name="twitter:description" content="Free health-career prep for high schoolers: a 10-pathway diagnostic, verified lessons, flashcards, and a full college application portfolio." />
    <meta name="twitter:image" content="https://medschoolprep.cloud/icon-512.png" />

    <!--
      Styling for the pre-JavaScript shell in <body> below.

      Inline, and in the head, because it has to be in effect for the very first
      paint — the whole point of the shell is that something readable is on
      screen before /src/main.jsx has even been fetched. A stylesheet link would
      be a second round trip and would sometimes lose the race.

      Colors are the Balanced palette's literals rather than tokens: src/index.css
      and the theme system are inside the JS bundle, and by the time either is
      available this element is already gone. They match theme-color above so
      the shell, the browser chrome and the app that replaces it are one surface.
    -->
    <style>
      .seo-shell {
        max-width: 44rem;
        margin: 0 auto;
        padding: 2rem 1.25rem 4rem;
        font-family: Onest, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #b6bcc6;
        line-height: 1.55;
        font-size: 1rem;
        font-optical-sizing: auto;
      }
      /* Tracking and leading follow the ramp in src/lib/tokens/type.js: tighter
         and closer together as the size goes up. Stated per level rather than
         shared, because one `-0.02em` across three sizes is only right for one
         of them. */
      .seo-shell h1, .seo-shell h2, .seo-shell h3 { color: #e7ecf2; }
      .seo-shell h1 { font-size: clamp(1.9rem, 5vw, 2.6rem); margin: 1.5rem 0 0.75rem; line-height: 1.08; letter-spacing: -0.028em; }
      .seo-shell h2 { font-size: 1.3rem; margin: 2.25rem 0 0.5rem; line-height: 1.28; letter-spacing: -0.019em; }
      .seo-shell h3 { font-size: 1.05rem; margin: 1.5rem 0 0.4rem; line-height: 1.4; letter-spacing: -0.008em; }
      .seo-shell a { color: #72b5f8; }
      .seo-shell .seo-shell-lead { font-size: 1.1rem; color: #b6bcc6; }
      .seo-shell ul, .seo-shell ol, .seo-shell dl { padding-left: 1.2rem; }
      .seo-shell li, .seo-shell dd { margin: 0.4rem 0; }
      .seo-shell dt { color: #e7ecf2; font-weight: 600; margin-top: 1rem; }
      .seo-shell dd { margin-left: 0; }
      .seo-shell-nav ul, .seo-shell-crumbs ol {
        list-style: none; padding: 0; margin: 0 0 0.5rem;
        display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; font-size: 0.9rem;
      }
      .seo-shell-note { border-left: 3px solid #5d646c; padding-left: 0.9rem; margin: 1rem 0; color: #b6bcc6; }
      .seo-shell-cta { margin-top: 2.5rem; font-weight: 600; }
      .seo-shell footer { margin-top: 3rem; border-top: 1px solid #30363d; padding-top: 1rem; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <!--
      #seo-shell is the anchor scripts/prerenderSeo.mjs replaces, per URL, with
      that page's real <h1>, body copy and internal links. It ships empty here so
      that `npm run dev` is unaffected; in dist/ it always has content.

      It lives inside #root deliberately: src/main.jsx removes it immediately
      before React's first render, so there is exactly one moment where either
      the shell or the app is on screen and never both. Anyone who arrives
      before the bundle does — a crawler that doesn't run JS, a phone on a bad
      connection, a reader with JS disabled — gets the page as plain HTML
      instead of a blank screen.
    -->
    <div id="root"><div id="seo-shell"></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
