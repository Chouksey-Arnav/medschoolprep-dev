# The checks that run on every push, and why this file exists at all.
#
# `npm run build` already gates a deploy on most of the verify:* scripts, which is what has kept
# routing, legal copy and lesson delivery honest. Two of them cannot live there:
#
#   verify:migrations  needs a real PostgreSQL, so it would make every local build depend on one.
#                      It is also the check that matters most — migrations here are applied BY HAND
#                      to one live project, and 0005 reached production unapplied and silently broke
#                      the Plans tab for every student who opened it. See the script's header.
#   verify:parent      is fast and has no dependencies, but it is the structural audit that a new
#                      endpoint went out without an authorization guard, which is exactly the kind
#                      of thing a developer skips when their build is already green.
#
# So they run here, on a service container, against every push and pull request.
#
# verify:api-boot is different: it IS in `npm run build`, so the build job below already runs it
# and a broken server can never produce a Docker image. It gets its own job anyway because that
# job takes ten minutes and installs a browser, and "the server does not start" is the one
# failure worth knowing about in the first thirty seconds.
name: verify

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  migrations:
    name: Migrations apply, re-apply, and serialize
    runs-on: ubuntu-latest

    services:
      postgres:
        # gen_random_uuid() (pgcrypto in older releases) and the jsonb operators the chain uses are
        # all core in 16, which is the version Supabase runs.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The migration harness shells out to psql; the runner image has a client, but pinning it to
      # the server's major version keeps error messages and \-command behaviour consistent.
      - name: Install the PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - run: npm ci

      - name: Verify migrations
        env:
          MIGRATION_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: npm run verify:migrations

  parent:
    name: Parent dashboard authorization audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify:parent

  api:
    name: API boots and every endpoint is routed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Starts server.js on an ephemeral port and probes every handler file over HTTP. No
      # database and no credentials: the probe is an OPTIONS request, which every handler answers
      # before it reaches Supabase.
      - run: npm run verify:api-boot

  build:
    name: Build (runs every other verify:* script)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # `npm run build` chains verify:viewport-fit, which drives real headless
      # Chromium (see that script's header) rather than mocking layout — the
      # only way it catches a CSS bug that only shows up in an actual browser.
      # `npm ci` installs the `playwright` package but not the browser binary
      # itself; without this step the runner has the library and not the
      # executable, and every build here fails on "Executable doesn't exist"
      # before a single verify script's assertions ever run.
      - run: npx playwright install --with-deps chromium
      # The browser is installed above, so here a browser that will not start is
      # a real failure and not an environment without one. The production image
      # build sets no such flag: there the check skips rather than blocking a
      # deploy, which is why this job has to be the one that enforces it.
      - run: npm run build
        env:
          REQUIRE_BROWSER_CHECKS: '1'
